<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hiển thị Đề Thi Toán từ File TEX</title>
    
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']]
            },
            svg: { fontCache: 'global' }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <style>
        .latex-container {
            border: 1px solid #ccc;
            padding: 20px;
            margin-top: 20px;
            min-height: 100px; /* Để tránh màn hình trống khi đang tải */
            text-align: center;
        }
        .exercise {
            counter-increment: ex_counter;
            margin-bottom: 25px;
            padding: 10px;
            border-left: 3px solid #007bff;
            background-color: #f8f9fa;
        }
        .exercise-header:before {
            content: "Bài " counter(ex_counter) ". ";
        }
        .exercise-header {
            font-weight: bold;
            color: #007bff;
            margin-bottom: 10px;
        }
        /* ... (Thêm các style khác nếu cần) ... */
        .loigiai {
            margin-top: 10px;
            padding: 5px;
            border-top: 1px dashed #adb5bd;
            font-style: italic;
            color: #28a745;
        }
        .correct-answer {
            font-weight: bold;
            color: green;
        }
    </style>
</head>
<body>

    <main class="content">
        <h1>Đề Số 1 – Giữa Học Kỳ I – Toán 11 (Tải từ file TEX)</h1>

        <div class="latex-container" id="latex-output">
            Đang tải nội dung đề thi...
        </div>
    </main>

    <script>
        const LATEX_FILE_PATH = 'latex/deon11-ghk1-1.tex'; // Đảm bảo đường dẫn này đúng

        async function fetchAndProcessLatex() {
            const outputContainer = document.getElementById('latex-output');
            outputContainer.innerHTML = 'Đang tải file TEX...';
            
            try {
                // Bước 1: Fetch nội dung từ file TEX
                const response = await fetch(LATEX_FILE_PATH);
                if (!response.ok) {
                    throw new Error(`Không thể tải file: ${response.status} ${response.statusText}`);
                }
                let latexContent = await response.text();

                outputContainer.innerHTML = ''; // Xóa thông báo tải
                const processedOutput = document.createElement('div');
                processedOutput.className = 'processed-output';
                outputContainer.appendChild(processedOutput);

                // Bước 2: Xử lý LaTeX thành HTML (Logic từ ví dụ trước)
                let processedHTML = '';
                let currentEx = 0;
                
                // Chuẩn hóa và làm sạch nội dung
                latexContent = latexContent.replace(/\\setcounter\{ex\}\{0\}\}\n/g, '');
                latexContent = latexContent.replace(/\\heva\{/g, '\\begin{array}{l}');
                latexContent = latexContent.replace(/\\hoac\{/g, '\\left\\{\\begin{array}{l}');
                latexContent = latexContent.replace(/\\}/g, '}').replace(/\\end\{array/g, '\\end{array').replace(/\\end\{ex\}/g, '\n\\end{ex}');
                
                let parts = latexContent.split(/\\textbf\{PHẦN [I|II|III]\. (.*?)\}/g);
                
                for (let i = 1; i < parts.length; i += 2) {
                    const partTitle = parts[i];
                    const partContent = parts[i + 1] || '';
                    processedHTML += `<h2>${partTitle}</h2>`;
                    
                    const exercises = partContent.split(/\\begin\{ex\}/).filter(e => e.trim().length > 0);

                    exercises.forEach(exBlock => {
                        let exParts = exBlock.split(/\\loigiai\{/);
                        let content = exParts[0].replace(/\\end\{ex\}/g, '').trim();
                        let solution = exParts.length > 1 ? exParts[1].replace(/\\}/, '').replace(/\\end\{ex\}/, '').trim() : '';
                        
                        let question = content;
                        let choicesHTML = '';
                        
                        if (content.includes('\\choice') || content.includes('\\choiceTF')) {
                            const choiceCommand = content.includes('\\choice') ? '\\choice' : '\\choiceTF';
                            let choiceParts = content.split(new RegExp(`\\${choiceCommand}`));
                            question = choiceParts[0].trim();
                            let rawChoices = choiceParts[1].match(/(\{[^}]*\})/g) || [];
                            
                            let choiceLetter = 'A';
                            choicesHTML += '<div>';
                            rawChoices.forEach(choice => {
                                let isTrue = choice.includes('\\True');
                                let cleanChoice = choice.replace(/\{/, '').replace(/\}/, '').replace(/\\True/, '').trim();
                                let displayClass = isTrue ? 'correct-answer' : '';
                                
                                if (choiceCommand === '\\choice') {
                                    choicesHTML += `<div class="choice-option ${displayClass}">(${choiceLetter++}) $${cleanChoice}$</div>`;
                                } else {
                                    let trueFalse = isTrue ? '(Đúng)' : '(Sai)';
                                    choicesHTML += `<div class="choice-tf-option ${displayClass}">$${cleanChoice}$ ${trueFalse}</div>`;
                                }
                            });
                            choicesHTML += '</div>';
                        }

                        currentEx++;
                        let exerciseHTML = `
                            <div class="exercise">
                                <div class="exercise-header"></div>
                                <div class="question">$${question.trim()}$</div>
                                ${choicesHTML}
                        `;
                        
                        if (solution) {
                            exerciseHTML += `<div class="loigiai">Lời giải: ${solution}</div>`;
                        }
                        exerciseHTML += `</div>`;
                        processedHTML += exerciseHTML;
                    });
                }
                
                processedOutput.innerHTML = processedHTML;

                // Bước 3: Gọi MathJax để render
                if (window.MathJax) {
                    MathJax.typesetPromise([outputContainer]);
                }

            } catch (error) {
                console.error("Lỗi khi tải hoặc xử lý file LaTeX:", error);
                outputContainer.innerHTML = `<p style="color:red;">Lỗi: Không thể tải hoặc xử lý file TEX. Vui lòng kiểm tra đường dẫn (${LATEX_FILE_PATH}) và đảm bảo bạn đang chạy máy chủ web cục bộ.</p>`;
            }
        }

        document.addEventListener("DOMContentLoaded", fetchAndProcessLatex);
    </script>

</body>
</html>
